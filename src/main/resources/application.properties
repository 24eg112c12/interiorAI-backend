spring.application.name=interiorai
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interiorai?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:interiorai}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.jackson.serialization.write-dates-as-timestamps=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.ai-provider=${AI_PROVIDER:demo}
app.ai-model=${OPENAI_IMAGE_MODEL:gpt-image-1.5}
app.openai-api-key=${OPENAI_API_KEY:}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
